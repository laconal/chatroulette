# Chat Roulette bot: public HTTPS endpoint for the Telegram webhook.
#
# Before use:
#   1. Replace bot.example.com with the host of WEBHOOK_BASE_URL (4 places).
#   2. Keep the "location" path equal to WEBHOOK_PATH and the upstream port equal to BOT_PORT.
#   3. Point ssl_certificate* at your certificate (the paths below are certbot's defaults).
#
# Step-by-step server setup: deploy/nginx.md

upstream chatroullete_bot {
    server 127.0.0.1:8085;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Telegram delivers webhooks only to ports 443, 80, 88 and 8443
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /webhook {
        # Networks Telegram sends webhooks from (https://core.telegram.org/bots/webhooks).
        # Remove these three lines if another proxy or CDN stands in front of Nginx.
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        proxy_pass http://chatroullete_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Nothing else is public, including the bot's /healthz
    location / {
        return 404;
    }
}
